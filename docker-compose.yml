services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: innogen
      POSTGRES_USER: innogen
      POSTGRES_PASSWORD: innogen
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - innogen_postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U innogen -d innogen"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - innogen_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  piston:
    image: ghcr.io/engineer-man/piston@sha256:2f66b7456189c4d713aa986d98eccd0b6ee16d26c7ec5f21b30e942756fd127a
    privileged: true
    restart: unless-stopped
    tmpfs:
      - /tmp:exec
    environment:
      PISTON_DISABLE_NETWORKING: "true"
      PISTON_RUN_TIMEOUT: "3000"
      PISTON_RUN_CPU_TIME: "3000"
      PISTON_COMPILE_MEMORY_LIMIT: "268435456"
      PISTON_RUN_MEMORY_LIMIT: "268435456"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:2000/api/v2/runtimes',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:${PISTON_HOST_PORT:-2000}:2000"
    volumes:
      - innogen_piston_data:/piston

  api_gateway:
    build:
      context: .
      args:
        SERVICE_PATH: api_gateway/cmd
    ports:
      - "127.0.0.1:${API_GATEWAY_HOST_PORT:-8080}:8080"
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://innogen:innogen@postgres:5432/innogen?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-innogen-dev-secret}
      API_GATEWAY_PORT: "8080"
      AUTH_SERVICE_URL: http://auth_service:8081
      RUN_SERVICE_URL: http://run_service:8082
      SUBMISSION_SERVICE_URL: http://submission_service:8083
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      - auth_service
      - run_service
      - submission_service

  auth_service:
    build:
      context: .
      args:
        SERVICE_PATH: auth_service/cmd
    ports:
      - "127.0.0.1:${AUTH_SERVICE_HOST_PORT:-8081}:8081"
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://innogen:innogen@postgres:5432/innogen?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-innogen-dev-secret}
      AUTH_SERVICE_PORT: "8081"
    depends_on:
      postgres:
        condition: service_healthy

  run_service:
    build:
      context: .
      args:
        SERVICE_PATH: run_service/cmd
    ports:
      - "127.0.0.1:${RUN_SERVICE_HOST_PORT:-8082}:8082"
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://innogen:innogen@postgres:5432/innogen?sslmode=disable
      RUN_SERVICE_PORT: "8082"
      PISTON_BASE_URL: http://piston:2000
    depends_on:
      postgres:
        condition: service_healthy
      piston:
        condition: service_healthy

  submission_service:
    build:
      context: .
      args:
        SERVICE_PATH: submission_service/cmd/api
    ports:
      - "127.0.0.1:${SUBMISSION_SERVICE_HOST_PORT:-8083}:8083"
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://innogen:innogen@postgres:5432/innogen?sslmode=disable
      REDIS_ADDR: redis:6379
      SUBMISSION_SERVICE_PORT: "8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  submission_worker:
    build:
      context: .
      args:
        SERVICE_PATH: submission_service/cmd/worker
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://innogen:innogen@postgres:5432/innogen?sslmode=disable
      REDIS_ADDR: redis:6379
      PISTON_BASE_URL: http://piston:2000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      piston:
        condition: service_healthy

volumes:
  innogen_postgres_data:
  innogen_redis_data:
  innogen_piston_data:
